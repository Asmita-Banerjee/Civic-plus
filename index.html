<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CivicPulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Figtree:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;500;600;700&display=swap">
<style>/* Layout idea: a calm civic-operations console. Warm paper ground, white working cards, forest-green action colour,
   status carried by pills and stripes; top bar on desktop, bottom tab bar on phones. */
:root{
  --bg:#F5F3EE; --card:#FFFFFF; --ink:#25292B; --muted:#62686B; --line:#E2DED5; --soft:#EEEBE4;
  --primary:#21604A; --primary-strong:#184A39; --primary-soft:#E3EEE8; --on-primary:#FFFFFF;
  --amber:#9A6516; --amber-soft:#FAF0DC; --red:#A9392F; --red-soft:#F7E4E1;
  --blue:#2F5F80; --blue-soft:#E3EDF4; --teal:#1F6D70; --teal-soft:#DFF0EF; --grey:#5F6467; --grey-soft:#ECEBE7;
  --map-land:#ECE8DF; --map-line:#CFC9BC; --shadow:0 1px 2px rgba(30,35,30,.05),0 4px 14px rgba(30,35,30,.05);
  --font-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --font-body:"Figtree","Noto Sans Kannada",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#161A19; --card:#1F2423; --ink:#E9ECE9; --muted:#A3ABA7; --line:#323A38; --soft:#272D2C;
    --primary:#5DB08E; --primary-strong:#7CC4A5; --primary-soft:#1F3A31; --on-primary:#0E1A15;
    --amber:#E0AE5C; --amber-soft:#3A2F1C; --red:#E5877D; --red-soft:#3D2422;
    --blue:#8DB8D6; --blue-soft:#1F2F3A; --teal:#77C3C2; --teal-soft:#1B3333; --grey:#A9AFAC; --grey-soft:#2A302F;
    --map-land:#222927; --map-line:#3A4441; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161A19; --card:#1F2423; --ink:#E9ECE9; --muted:#A3ABA7; --line:#323A38; --soft:#272D2C;
  --primary:#5DB08E; --primary-strong:#7CC4A5; --primary-soft:#1F3A31; --on-primary:#0E1A15;
  --amber:#E0AE5C; --amber-soft:#3A2F1C; --red:#E5877D; --red-soft:#3D2422;
  --blue:#8DB8D6; --blue-soft:#1F2F3A; --teal:#77C3C2; --teal-soft:#1B3333; --grey:#A9AFAC; --grey-soft:#2A302F;
  --map-land:#222927; --map-line:#3A4441; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{min-height:100%;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
@media (min-width:900px){body{padding-bottom:0}}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(30px,5vw,50px);font-weight:700}
h2{font-size:22px;font-weight:650}
h3{font-size:17px;font-weight:600}
h4{font-size:14px;font-weight:600}
p{margin:0}
a{color:var(--primary);text-underline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-lg{display:flex;flex-direction:column;gap:22px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.side{display:grid;gap:18px;grid-template-columns:1fr}
@media (min-width:980px){.side{grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr)}}

/* header */
.top{position:sticky;top:0;z-index:1000;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;height:60px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:700;font-size:19px;color:var(--ink);text-decoration:none;white-space:nowrap}
.brand svg{flex:none}
.nav{display:none;gap:2px;margin-left:8px}
@media (min-width:900px){.nav{display:flex}}
.nav a{padding:7px 11px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500;font-size:14px;white-space:nowrap}
.nav a:hover{background:var(--soft);color:var(--ink)}
.nav a.on{color:var(--primary);background:var(--primary-soft)}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.iconbtn{position:relative;display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--ink)}
.iconbtn:hover{border-color:var(--muted)}
.dot{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px;font-weight:600}
.rolechip{font-size:12px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.langbtn{font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--card);border-radius:10px;height:38px;padding:0 10px;cursor:pointer}

/* bottom tab bar */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:1000;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
@media (min-width:900px){.tabbar{display:none}}
.tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);text-decoration:none;background:none;border:0;padding:4px 0;cursor:pointer}
.tabbar .on{color:var(--primary)}
.tabbar .plus{width:44px;height:34px;border-radius:12px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center}

/* surfaces */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card.tight{padding:14px}
.section{padding:26px 0}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.banner{border-radius:10px;padding:11px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start;border:1px solid}
.banner.info{background:var(--blue-soft);border-color:color-mix(in srgb,var(--blue) 30%,transparent)}
.banner.warn{background:var(--amber-soft);border-color:color-mix(in srgb,var(--amber) 35%,transparent)}
.banner.danger{background:var(--red-soft);border-color:color-mix(in srgb,var(--red) 35%,transparent)}
.banner.ok{background:var(--primary-soft);border-color:color-mix(in srgb,var(--primary) 30%,transparent)}
hr.sep{border:0;border-top:1px solid var(--line);margin:4px 0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{background:var(--primary-strong)}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.amber{background:var(--amber-soft);border-color:color-mix(in srgb,var(--amber) 40%,transparent);color:var(--amber)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--soft)}
.btn.sm{height:32px;padding:0 11px;font-size:13px;border-radius:8px}
.btn.lg{height:48px;padding:0 22px;font-size:15px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--primary-soft);color:var(--primary);font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--primary);border-bottom-color:var(--primary)}

/* forms */
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
label.f .hint{font-weight:400;color:var(--muted)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;font-size:15px;font-weight:400}
textarea.input{min-height:96px;resize:vertical}
.input:focus{outline:2px solid color-mix(in srgb,var(--primary) 45%,transparent);border-color:var(--primary)}
.check{display:flex;gap:9px;align-items:flex-start;font-size:14px;font-weight:500;cursor:pointer}
.check input{margin-top:3px;accent-color:var(--primary);width:16px;height:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chipbtn.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary);font-weight:600}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:16px;text-align:center;cursor:pointer;background:var(--soft)}
.drop:hover{border-color:var(--primary)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--soft)}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;line-height:1}

/* pills and status */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap;border:1px solid transparent}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.plain::before{display:none}
.t-grey{background:var(--grey-soft);color:var(--grey)}
.t-slate,.t-blue{background:var(--blue-soft);color:var(--blue)}
.t-teal{background:var(--teal-soft);color:var(--teal)}
.t-amber{background:var(--amber-soft);color:var(--amber)}
.t-green{background:var(--primary-soft);color:var(--primary)}
.t-red{background:var(--red-soft);color:var(--red)}
.sample{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--amber);border:1px dashed color-mix(in srgb,var(--amber) 60%,transparent);border-radius:6px;padding:1px 6px;white-space:nowrap}
.prio{display:inline-flex;align-items:baseline;gap:4px;font-weight:700;font-variant-numeric:tabular-nums}

/* tiles */
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.tile .k{font-size:12px;color:var(--muted);font-weight:500}
.tile .v{font-family:var(--font-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.tile.accent{border-left:3px solid var(--primary)}
.tile.amber{border-left:3px solid var(--amber)}
.tile.red{border-left:3px solid var(--red)}
.tile.blue{border-left:3px solid var(--blue)}

/* complaint list */
.clist{display:flex;flex-direction:column}
.citem{display:grid;grid-template-columns:4px 1fr auto;gap:12px;padding:12px 6px 12px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;align-items:center}
.citem:last-child{border-bottom:0}
.citem:hover{background:var(--soft)}
.citem .stripe{align-self:stretch;border-radius:3px;background:var(--line)}
.citem .stripe.s5,.citem .stripe.s4{background:var(--red)}
.citem .stripe.s3{background:var(--amber)}
.citem .stripe.s2{background:var(--teal)}
.citem .ttl{font-weight:600}
.citem .meta{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.citem .right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.scroll-x{overflow-x:auto}

/* stepper and timeline */
.stepper{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.step{display:flex;flex-direction:column;gap:6px;font-size:11.5px;color:var(--muted);text-align:center}
.step .bar{height:5px;border-radius:3px;background:var(--line)}
.step.done .bar{background:var(--primary)}
.step.cur .bar{background:var(--amber)}
.step.cur{color:var(--ink);font-weight:600}
.timeline{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:6px}
.tl{position:relative;padding:0 0 16px 18px}
.tl::before{content:"";position:absolute;left:-7px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--primary)}
.tl.red::before{border-color:var(--red)}
.tl.amber::before{border-color:var(--amber)}
.tl .when{font-size:12px;color:var(--muted)}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ba figure{margin:0;display:flex;flex-direction:column;gap:6px}
.ba img,.gallery img,.gallery video{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--soft)}
.ba .ph{aspect-ratio:4/3;border-radius:10px;border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;padding:8px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}

/* hero */
.hero{padding:34px 0 18px}
.hero-grid{display:grid;gap:26px;align-items:center}
@media (min-width:900px){.hero-grid{grid-template-columns:1.1fr .9fr}}
.hero .lead{font-size:17px;color:var(--muted);max-width:56ch;margin-top:12px}
.hero .tag{color:var(--primary)}
.pulse-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.how{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));counter-reset:how}
.how .card{counter-increment:how}
.how .card h3::before{content:counter(how);display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--primary-soft);color:var(--primary);font-size:13px;margin-right:8px;vertical-align:1px}
footer.foot{border-top:1px solid var(--line);padding:28px 0 40px;margin-top:30px;color:var(--muted);font-size:13px}

/* map */
.map{height:440px;border-radius:12px;border:1px solid var(--line);overflow:hidden;background:var(--map-land);z-index:1}
.map.tall{height:min(70vh,640px)}
.map.short{height:300px}
.map.mini{height:200px}
.leaflet-container{background:var(--bg)!important;font-family:var(--font-body)!important}
.loc-label{background:none!important;border:0!important;box-shadow:none!important;color:var(--muted)!important;font-size:11px!important;font-weight:600;text-shadow:0 0 3px var(--map-land)}
.loc-label::before{display:none}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--card)!important;color:var(--ink)!important}
.leaflet-popup-content{margin:12px 14px!important;font-size:13px!important;line-height:1.45!important}
.leaflet-control-zoom a{background:var(--card)!important;color:var(--ink)!important;border-color:var(--line)!important}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}

/* misc */
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;font-size:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500}
details.method{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--card)}
details.method summary{cursor:pointer;font-weight:600;font-size:14px}
pre.code{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:12px;overflow:auto;max-height:420px}
.bar-h{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.bar-h span{display:block;height:100%;background:var(--primary);border-radius:4px}
.score{font-family:var(--font-display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums}
.ai{border:1px solid color-mix(in srgb,var(--teal) 35%,transparent);background:var(--teal-soft);border-radius:12px;padding:12px 14px;font-size:14px}
.sos-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.sos-btn{border:1px solid color-mix(in srgb,var(--red) 40%,transparent);background:var(--red-soft);color:var(--red);border-radius:14px;padding:18px 12px;font-weight:700;font-size:15px;cursor:pointer;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.sos-btn:hover{border-color:var(--red)}
.sos-btn.on{background:var(--red);color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:3000;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:90vw}
@media (min-width:900px){.toast{bottom:24px}}
.updates{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:2000}
.modal-bg{position:fixed;inset:0;background:rgba(15,20,18,.45);z-index:2500;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.modal-bg{align-items:center}}
.modal{background:var(--card);width:min(560px,100%);max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:20px;display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.modal{border-radius:16px}}
.sheet-links{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet-links a{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);font-weight:500;font-size:14px}
.cert{border:2px solid var(--primary);border-radius:14px;padding:28px;text-align:center;background:var(--card)}
.cert h2{font-size:26px}
.fade-in{animation:fi .25s ease both}
@keyframes fi{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.skeleton{color:var(--muted);padding:40px 0;text-align:center}
.hidden{display:none!important}
@media (max-width:600px){.rc-long{display:none}.rolechip{max-width:120px;overflow:hidden;text-overflow:ellipsis}.brand span{display:none}.top .wrap{gap:8px}}

/* Leaflet 1.9.4 */
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}

const C_SOURCE = "/*\n * CivicPulse algorithm engine (C, compiled to WebAssembly).\n *\n * Modules:\n *   - cp_distance_m        : location distance (equirectangular approximation, accurate at city scale)\n *   - cp_severity          : severity level 1..5 from category risk, hazard flags and support count\n *   - cp_priority          : priority score 0..100 (safety, vulnerable groups, population, location, age)\n *   - cp_find_duplicates   : location + category based duplicate candidates\n *   - cp_hamming64         : perceptual-hash distance between two images (64-bit dHash split in 2x32)\n *\n * Build (WebAssembly, no libc):\n *   clang --target=wasm32 -O2 -nostdlib -Wl,--no-entry -Wl,--export-dynamic -o civic_engine.wasm civic_engine.c\n * Build (native shared library for Python ctypes):\n *   gcc -O2 -shared -fPIC -o libcivic_engine.so civic_engine.c\n */\n\n#define EXPORT __attribute__((visibility(\"default\")))\n#define PI 3.14159265358979323846\n#define EARTH_R 6371000.0\n\nstatic double cp_sqrt(double x) { return __builtin_sqrt(x); }\n\n/* cos(x) by Taylor series after range reduction; enough precision for latitudes. */\nstatic double cp_cos(double x) {\n    while (x > PI) x -= 2 * PI;\n    while (x < -PI) x += 2 * PI;\n    double x2 = x * x, term = 1.0, sum = 1.0;\n    for (int i = 1; i < 12; i++) {\n        term *= -x2 / ((2 * i - 1) * (2 * i));\n        sum += term;\n    }\n    return sum;\n}\n\nEXPORT double cp_distance_m(double lat1, double lon1, double lat2, double lon2) {\n    double p1 = lat1 * PI / 180.0, p2 = lat2 * PI / 180.0;\n    double dx = (lon2 - lon1) * PI / 180.0 * cp_cos((p1 + p2) / 2.0);\n    double dy = p2 - p1;\n    return EARTH_R * cp_sqrt(dx * dx + dy * dy);\n}\n\n/* hazard flags bitmask */\n#define HZ_ELECTRICAL 1\n#define HZ_OPEN_PIT   2\n#define HZ_FLOODING   4\n#define HZ_TRAFFIC    8\n#define HZ_HEALTH     16\n\nstatic int popcount(unsigned int v) { int c = 0; while (v) { c += v & 1u; v >>= 1; } return c; }\n\n/* category_risk 1..5 (from category table), user_severity 1..5 (citizen estimate, 0 = none) */\nEXPORT int cp_severity(int category_risk, int hazard_flags, int supports, int user_severity) {\n    double s = category_risk;\n    if (hazard_flags & HZ_ELECTRICAL) s += 1.5;\n    if (hazard_flags & HZ_OPEN_PIT) s += 1.0;\n    if (hazard_flags & HZ_FLOODING) s += 0.8;\n    s += 0.3 * popcount((unsigned)(hazard_flags & (HZ_TRAFFIC | HZ_HEALTH)));\n    if (supports >= 10) s += 1.0; else if (supports >= 3) s += 0.5;\n    if (user_severity > 0) s = 0.7 * s + 0.3 * user_severity;\n    int r = (int)(s + 0.5);\n    if (r < 1) r = 1;\n    if (r > 5) r = 5;\n    return r;\n}\n\n/* vulnerable flags: 1 seniors, 2 children/school, 4 disabled, 8 pedestrians, 16 emergency access */\n/* population band 0..3 (street, block, neighbourhood, arterial); location sensitivity 0..3\n   (none, market/transit, school/hospital, emergency route) */\nEXPORT double cp_priority(int severity, int vulnerable_flags, int population_band,\n                          int location_sensitivity, double age_days, int supports, int reopen_count) {\n    double score = 0;\n    score += severity * 9.0;                                   /* up to 45: safety risk   */\n    score += popcount((unsigned)vulnerable_flags) * 4.0;       /* up to 20: vulnerable    */\n    if (vulnerable_flags & 16) score += 3.0;                   /* emergency access bonus  */\n    score += population_band * 3.0;                            /* up to 9                 */\n    score += location_sensitivity * 3.0;                       /* up to 9                 */\n    double age = age_days > 30 ? 30 : (age_days < 0 ? 0 : age_days);\n    score += age * 0.2;                                        /* up to 6: waiting time   */\n    double sup = supports > 20 ? 20 : supports;\n    score += sup * 0.25;                                       /* up to 5                 */\n    score += (reopen_count > 3 ? 3 : reopen_count) * 2.0;      /* up to 6: failed repairs */\n    if (score > 100) score = 100;\n    return score;\n}\n\n/* Shared buffers so JavaScript can pass arrays without an allocator. */\n#define MAXN 4096\nEXPORT double cp_lat[MAXN];\nEXPORT double cp_lon[MAXN];\nEXPORT int cp_cat[MAXN];\nEXPORT int cp_out[MAXN];\nEXPORT double cp_dist[MAXN];\n\nEXPORT double *cp_lat_ptr(void) { return cp_lat; }\nEXPORT double *cp_lon_ptr(void) { return cp_lon; }\nEXPORT int *cp_cat_ptr(void) { return cp_cat; }\nEXPORT int *cp_out_ptr(void) { return cp_out; }\nEXPORT double *cp_dist_ptr(void) { return cp_dist; }\n\n/* Returns how many of the first n stored points are within radius_m and share category (cat<0 = any). */\nEXPORT int cp_find_duplicates(int n, double lat, double lon, int cat, double radius_m) {\n    int k = 0;\n    if (n > MAXN) n = MAXN;\n    for (int i = 0; i < n; i++) {\n        if (cat >= 0 && cp_cat[i] != cat) continue;\n        double d = cp_distance_m(lat, lon, cp_lat[i], cp_lon[i]);\n        if (d <= radius_m) { cp_out[k] = i; cp_dist[k] = d; k++; }\n    }\n    return k;\n}\n\nEXPORT int cp_hamming64(unsigned int a_hi, unsigned int a_lo, unsigned int b_hi, unsigned int b_lo) {\n    return popcount(a_hi ^ b_hi) + popcount(a_lo ^ b_lo);\n}\n";

/* ============ Analytics: duplicates, civic health, predictions, repeat locations ============ */

/* Duplicate detection: C engine proximity search + description similarity + image hash + category. */
function findDuplicates(d) {
  if (d.lat == null) return [];
  const cats = cfg().categories.map((c) => c.id);
  const pool = allC().filter((c) => c.lat != null && (isOpen(c) || (c.status === "confirmed" && now() - (c.closedAt || 0) < 14 * DAY)) && !c.groupId);
  const pts = pool.map((c) => ({ lat: c.lat, lng: c.lng, cat: cats.indexOf(c.cat) }));
  const radius = cfg().dupRadius || 75;
  const hits = E.near(pts, d.lat, d.lng, -1, radius * 1.4);
  const out = [];
  for (const h of hits) {
    const c = pool[h.i];
    const sameCat = c.cat === d.cat;
    const prox = clamp(1 - h.d / (radius * 1.4), 0, 1);
    const text = jaccard(d.title + " " + d.desc, c.title + " " + c.desc);
    let img = null;
    const hA = (d.hashes || [])[0], hB = (c.media || []).find((m) => m.hash)?.hash;
    if (hA && hB) img = 1 - E.hamming(hA, hB) / 64;
    let score = 0.45 * prox + 0.25 * text + (sameCat ? 0.2 : 0) + (img != null ? 0.1 * img : 0.05);
    if (!sameCat && text < 0.2) score *= 0.6;
    out.push({ c, d: h.d, score, sameCat, text, img });
  }
  return out.filter((o) => o.score >= 0.4).sort((a, b) => b.score - a.score).slice(0, 4);
}

/* Repeat locations: problems that return after a confirmed repair, or complaints reopened twice or more. */
function repeatLocations() {
  const res = [];
  const list = allC();
  for (const a of list) {
    if (a.status !== "confirmed" || !a.closedAt || a.lat == null) continue;
    const later = list.filter((b) => b._id !== a._id && b.cat === a.cat && b.lat != null && b.createdAt > a.closedAt && b.createdAt - a.closedAt < 150 * DAY && E.distance(a.lat, a.lng, b.lat, b.lng) < 100);
    if (later.length) res.push({ kind: "returned", base: a, later, locality: a.locality, cat: a.cat, days: Math.round((later[0].createdAt - a.closedAt) / DAY) });
  }
  for (const c of list) if ((c.reopenCount || 0) >= 2) res.push({ kind: "reopened", base: c, later: [], locality: c.locality, cat: c.cat, reopen: c.reopenCount });
  return res;
}

/* Civic Health Score per locality. Starts at 100; each factor subtracts up to its cap. */
const HEALTH_METHOD = [
  ["Unresolved backlog", 30, "Sum of severity of open complaints × 1.5"],
  ["Slow resolution", 20, "Median days to citizen-confirmed fix beyond the service target, × 2 per day"],
  ["Recurring problems", 15, "5 points per repeat location (problem came back after repair, or reopened twice)"],
  ["Open safety hazards", 15, "5 points per open complaint with severity 4–5 or Civic SOS"],
  ["Accessibility", 10, "3 points per open accessibility barrier or unresolved footpath obstacle"],
  ["Failed repairs", 10, "2 points per citizen dispute (reopening) in the last 180 days"],
];
function healthScores() {
  const list = allC(); const reps = repeatLocations();
  const counts = LOC.map((l) => list.filter((c) => c.locality === l.id).length);
  const med = median(counts.filter((x) => x > 0)) || 0;
  return LOC.map((l) => {
    const mine = list.filter((c) => c.locality === l.id);
    const open = mine.filter(isOpen);
    const res = mine.map(resolutionDays).filter((x) => x != null);
    const medRes = median(res);
    const target = 7;
    const f = {
      backlog: Math.min(30, open.reduce((s, c) => s + (c.severity || scores(c).severity), 0) * 1.5),
      slow: medRes == null ? 0 : Math.min(20, Math.max(0, medRes - target) * 2),
      recurring: Math.min(15, reps.filter((r) => r.locality === l.id).length * 5),
      safety: Math.min(15, open.filter((c) => (c.severity || scores(c).severity) >= 4 || c.sos).length * 5),
      access: Math.min(10, (open.filter((c) => c.cat === "accessibility").length + S.access.filter((a) => a.kind === "obstacle" && a.locality === l.id && !a.cleared).length) * 3),
      failed: Math.min(10, mine.reduce((s, c) => s + (c.timeline || []).filter((e) => e.type === "disputed" && now() - e.at < 180 * DAY).length, 0) * 2),
    };
    const score = Math.round(100 - Object.values(f).reduce((a, b) => a + b, 0));
    const lowData = mine.length < Math.max(2, med * 0.35);
    return { l, score, f, n: mine.length, open: open.length, medRes, lowData, confirmed: mine.filter((c) => c.status === "confirmed").length };
  });
}

/* Predictive civic intelligence: recurrence statistics per locality and category, weighted for the monsoon months. */
const PRED_CATS = { flooding: "Flooding", drainage: "Drain blockage", pothole: "Potholes", garbage: "Garbage accumulation", sewage: "Sewage overflow", road_damage: "Potholes" };
function predictions() {
  const list = allC(); const out = new Map(); const m = new Date().getMonth();
  const monsoon = [5, 6, 7, 8, 9, 10].includes(m) || [5, 6, 7, 8, 9, 10].includes((m + 1) % 12);
  for (const c of list) {
    const label = PRED_CATS[c.cat]; if (!label || !c.locality) continue;
    const key = c.locality + "|" + label;
    const o = out.get(key) || { locality: c.locality, label, n: 0, recent: 0, monsoonN: 0, months: new Set(), ids: [] };
    o.n++; o.ids.push(c._id); const age = now() - c.createdAt; if (age < 180 * DAY) o.recent++;
    const cm = new Date(c.createdAt).getMonth(); o.months.add(new Date(c.createdAt).getFullYear() * 12 + cm); if (cm >= 5 && cm <= 10) o.monsoonN++;
    out.set(key, o);
  }
  const rain = activeRainAlerts();
  return [...out.values()].filter((o) => o.n >= 2).map((o) => {
    let p = 0.18 * o.months.size + 0.12 * o.recent;
    const wet = ["Flooding", "Drain blockage", "Sewage overflow", "Potholes"].includes(o.label);
    if (wet && monsoon) p += 0.15 * (o.monsoonN / o.n);
    const alert = rain.find((a) => (a.localities || []).includes(o.locality) || (a.localities || []).length === 0);
    if (wet && alert) p += alert.level === "red" ? 0.3 : alert.level === "orange" ? 0.2 : 0.1;
    p = clamp(p, 0, 0.95);
    return { ...o, p, months: o.months.size, alert, why: `${o.n} past reports across ${o.months.size} month(s), ${o.recent} in the last 6 months${wet && monsoon ? ", monsoon season" : ""}${alert ? ", active rain alert" : ""}` };
  }).sort((a, b) => b.p - a.p);
}
function activeRainAlerts() { return S.alerts.filter((a) => a.until && a.until > now()); }

/* Unheard neighbourhoods: reporting activity relative to the city median. */
function reportingActivity() {
  const list = allC(); const yr = now() - 365 * DAY;
  const rows = LOC.map((l) => ({ l, n: list.filter((c) => c.locality === l.id && c.createdAt > yr).length, surveys: S.surveys.filter((s) => s.locality === l.id).length }));
  const med = median(rows.map((r) => r.n)) || 0;
  return rows.map((r) => ({ ...r, ratio: med ? r.n / med : 0, low: r.n < med * 0.5 || r.n <= 1 })).sort((a, b) => a.ratio - b.ratio);
}

/* Department performance. */
function deptStats(deptId) {
  const list = allC().filter((c) => !deptId || c.dept === deptId);
  const conf = list.filter((c) => c.status === "confirmed");
  const res = conf.map(resolutionDays).filter((x) => x != null);
  const closedByDept = list.filter((c) => (c.resolutions || []).length);
  const firstTime = closedByDept.filter((c) => c.status === "confirmed" && (c.reopenCount || 0) === 0).length;
  return {
    total: list.length, open: list.filter(isOpen).length, overdue: list.filter(overdue).length,
    reopened: list.filter((c) => (c.reopenCount || 0) > 0).length, confirmed: conf.length,
    lapsed: list.filter((c) => c.status === "lapsed").length,
    avgDays: res.length ? res.reduce((a, b) => a + b, 0) / res.length : null,
    firstTimeRate: closedByDept.length ? firstTime / closedByDept.length : null,
    awaiting: list.filter((c) => c.status === "awaiting").length,
    escalated: list.filter((c) => isOpen(c) && (c.escalated || 0) > 0).length,
  };
}

/* Civic Challenge: verified improvements per locality this month. */
function challengeBoard() {
  const start = new Date(); start.setDate(1); start.setHours(0, 0, 0, 0);
  const t0 = start.getTime();
  return LOC.map((l) => {
    const list = allC().filter((c) => c.locality === l.id);
    const fixes = list.filter((c) => c.status === "confirmed" && c.closedAt >= t0).length;
    const cv = list.reduce((s, c) => s + (c.community || []).filter((v) => v.at >= t0).length, 0);
    const reop = list.reduce((s, c) => s + (c.timeline || []).filter((e) => e.type === "disputed" && e.at >= t0).length, 0);
    const vol = S.events.filter((e) => e.locality === l.id && e.date >= t0 && e.date <= now()).reduce((s, e) => s + (e.participants || []).filter((p) => p.attended).length, 0);
    return { l, fixes, cv, reop, vol, points: fixes * 10 + cv * 3 + vol * 2 - reop * 5 };
  }).sort((a, b) => b.points - a.points);
}

/* Automatic escalation and verification deadlines. Runs on staff devices; each change is written once. */
let autoRan = false;
async function runAutomation() {
  if (autoRan || !isStaff() || S.readOnly || !S.db) return; autoRan = true;
  for (const c of allC()) {
    try {
      if (c.status === "awaiting" && c.verifyDeadline && now() > c.verifyDeadline && cfg().lapseAction === "close_unverified") {
        await patchComplaint(c._id, (x) => { x.status = "lapsed"; x.closedAt = now(); const r = x.resolutions?.[x.resolutions.length - 1]; if (r) r.outcome = "no_response"; },
          { type: "lapsed", auto: true, note: `The reporter did not respond within ${cfg().verifyDays} days. Closed without citizen confirmation; the record does not count as citizen-confirmed.` });
      } else if (overdue(c) && (!c.escalatedAt || now() - c.escalatedAt > sla(c.severity || 3) * DAY)) {
        const lvl = (c.escalated || 0) + 1;
        await patchComplaint(c._id, (x) => { x.escalated = lvl; x.escalatedAt = now(); },
          { type: "escalated", auto: true, note: `Overdue by ${Math.ceil((now() - c.dueAt) / DAY)} day(s). Escalated to level ${lvl}; department supervisor notified.` });
      }
    } catch (e) { console.warn("automation", e); }
  }
}

  let res;
  try {
    res = await S.sample.json(`CivicPulse repair-evidence review. Image 1 is the citizen's photo of a reported problem: "${c.title}" (${catOf(c.cat).en}). Image 2 is the department's after-repair photo. Judge only from the images whether image 2 shows the same place with the problem fixed. Reply with only JSON: {"verdict": "Looks fixed" | "Not clearly fixed" | "Different location or unclear", "confidence": 0-1, "notes": "one or two short sentences"}`, { images: [bb, ab], modelTier: "default" });
  } catch (e) { throw new Error(sampleErr(e)); }
  await patchComplaint(c._id, (x) => { x.resolutions[x.resolutions.length - 1].aiCheck = { ...res, at: now() }; }, { type: "ai_check", note: `${res.verdict} (advisory, does not change status)` });
}

/* ----- citizen verification panel ----- */
function citizenPanel(c, lastRes) {
  if (c.status === "awaiting") {
    const left = c.verifyDeadline ? Math.max(0, Math.ceil((c.verifyDeadline - now()) / DAY)) : null;
    return `<div class="card stack" style="border-color:var(--amber);border-width:2px"><div class="eyebrow" style="color:var(--amber)">Your confirmation is needed</div>
      <h3>The department says this is fixed. Is it?</h3><p class="small muted">Look at the after-repair photo below and, if you can, check the spot yourself. Only you, the original reporter, can close this complaint.${left != null ? ` ${left} day${left === 1 ? "" : "s"} left to respond.` : ""}</p>
      <div class="row"><button class="btn primary lg" id="vYes">${icon("check", 18)}${esc(t("yes"))}</button><button class="btn danger lg" id="vNo">${icon("x", 18)}${esc(t("no"))}</button></div>
      <div id="vNoForm" class="stack hidden">
        <label class="f">What is still wrong? *<textarea class="input" id="vReason" maxlength="1000" placeholder="e.g. The pothole was filled with loose gravel and has opened again."></textarea></label>
        <label class="f">Fresh photos (optional)<input type="file" id="vFiles" accept="image/*" multiple class="input"></label>
        <button class="btn danger" id="vNoSend">Reopen complaint</button>
      </div></div>`;
  }
  if (c.status === "rejected") return `<div class="card stack"><h3>Disagree with the rejection?</h3><label class="f">Explain why this needs action<textarea class="input" id="cReason" maxlength="1000"></textarea></label><button class="btn" id="cContest">Ask for it to be reopened</button></div>`;
  if (c.status === "lapsed" || (c.status === "confirmed" && now() - (c.closedAt || 0) < 60 * DAY)) return `<div class="card stack"><h3>Has the problem come back?</h3><label class="f">What's wrong now?<textarea class="input" id="cReason" maxlength="1000"></textarea></label><button class="btn" id="cContest">Reopen complaint</button></div>`;
  if (c.status === "confirmed") return `<div class="banner ok">${icon("check")}<div>You confirmed this was fixed on ${fmtDate(c.closedAt)}. Thank you.</div></div>`;
  return `<div class="banner info">${icon("info")}<div>This is your complaint. You'll be asked to confirm the repair when the department reports it fixed.</div></div>`;
}
function bindCitizen(c) {
  const y = $("#vYes"), n = $("#vNo");
  if (y) y.onclick = async () => {
    if (!guardWrite() || !(await confirmBox("Confirm the repair?", "This closes the complaint as fixed and records your confirmation with today's date.", "Yes, it's fixed"))) return;
    busy(y, async () => { await patchComplaint(c._id, (x) => { x.status = "confirmed"; x.closedAt = now(); x.citizenConfirmedAt = now(); const r = x.resolutions[x.resolutions.length - 1]; r.outcome = "confirmed"; r.respondedAt = now(); }, { type: "confirmed", note: "Reporter confirmed the repair is done." }); toast("Thanks. The complaint is closed as fixed."); });
  };
  if (n) n.onclick = () => { $("#vNoForm").classList.remove("hidden"); $("#vReason").focus(); };
  const send = $("#vNoSend");
  if (send) send.onclick = () => busy(send, async () => {
    if (!guardWrite()) return; const reason = $("#vReason").value.trim(); if (reason.length < 5) { toast("Say briefly what is still wrong."); return; }
    const media = []; for (const f of [...$("#vFiles").files].slice(0, 3)) media.push(await storeMedia(f));
    await patchComplaint(c._id, (x) => { x.status = "reopened"; x.reopenCount = (x.reopenCount || 0) + 1; x.dueAt = now() + sla(x.severity || 3) * DAY; delete x.verifyDeadline; const r = x.resolutions[x.resolutions.length - 1]; r.outcome = "disputed"; r.citizenNote = reason; r.citizenMedia = media; r.respondedAt = now(); },
      { type: "disputed", note: reason });
    toast("Complaint reopened. The department has been notified.");
  }, "Reopening…");
  const ct = $("#cContest");
  if (ct) ct.onclick = () => busy(ct, async () => {
    if (!guardWrite()) return; const reason = $("#cReason").value.trim(); if (reason.length < 5) { toast("Add a short explanation."); return; }
    await patchComplaint(c._id, (x) => { x.status = "reopened"; x.reopenCount = (x.reopenCount || 0) + 1; x.closedAt = null; x.dueAt = now() + sla(x.severity || 3) * DAY; }, { type: "reopened", note: reason });
    toast("Complaint reopened.");
  });
}

/* ----- government / staff panel ----- */
function staffPanel(c, lastRes) {
  const d = deptOf(c.dept); const teams = d.teams || [];
  const st = c.status; let body = "";
  const teamSel = `<select class="input" id="sTeam">${teams.map((x) => `<option ${c.team === x ? "selected" : ""}>${esc(x)}</option>`).join("")}<option value="__other">Other team…</option></select>`;
  if (st === "submitted") body = `<p class="small muted">Check the report is genuine and belongs to ${esc(d.name)}.</p><div class="row"><button class="btn primary" data-s="review">Accept for review</button><button class="btn" id="sRejectOpen">Reject…</button></div>`;
  else if (st === "review" || st === "reopened") body = `<label class="f">Assign a maintenance team${teamSel}</label><input class="input hidden" id="sTeamOther" placeholder="Team name" maxlength="80"><label class="f">Note for the citizen (optional)<input class="input" id="sNote" maxlength="300"></label><div class="row"><button class="btn primary" id="sAssign">Assign team</button>${st === "review" ? '<button class="btn" id="sRejectOpen">Reject…</button>' : ""}</div>`;
  else if (st === "assigned") body = `<p class="small muted">Assigned to ${esc(c.team || "a team")}.</p><button class="btn primary" data-s="progress">Mark work started</button>`;
  else if (st === "progress") body = `<p class="small">Upload after-repair photos and describe the fix. The status becomes <strong>Awaiting citizen verification</strong>; only the reporter can close it.</p>
    <label class="f">What was done? *<textarea class="input" id="sResNote" maxlength="1000" placeholder="e.g. Pothole cut, compacted and resurfaced with hot-mix asphalt."></textarea></label>
    <label class="f">After-repair photos * <span class="hint">At least one photo of the same spot.</span><input type="file" id="sResFiles" accept="image/*,video/*" multiple class="input"></label>
    <button class="btn primary" id="sResolve">Submit repair for citizen verification</button>`;
  else if (st === "awaiting") body = `<div class="banner warn">Waiting for the reporter to confirm. Departments can't close complaints themselves.</div>${isAdmin() && c.verifyDeadline && now() > c.verifyDeadline ? '<button class="btn" id="sLapse">Close as not verified (deadline passed)</button>' : ""}`;
  else body = `<p class="small muted">This complaint is closed (${esc(L2(STATUS[st]))}).</p>`;
  const disputed = lastRes && lastRes.outcome === "disputed" && st === "reopened";
  return `<div class="card stack" style="border-left:3px solid var(--blue)"><div class="row between"><div class="eyebrow" style="color:var(--blue)">Department actions</div><span class="tiny muted">${esc(d.name)}</span></div>
    ${disputed ? `<div class="banner danger small">The reporter disputed the last repair: "${esc(lastRes.citizenNote)}". Reply below and send a team again.</div>
      <label class="f">Reply to the reporter<textarea class="input" id="sDisp" maxlength="800"></textarea></label><button class="btn sm" id="sDispSend">Send reply</button><hr class="sep">` : ""}
    ${body}
    <div id="sRejectForm" class="stack hidden"><label class="f">Reason for rejection * <span class="hint">The citizen sees this and can contest it.</span><textarea class="input" id="sRejReason" maxlength="500"></textarea></label><button class="btn danger" id="sReject">Reject complaint</button></div>
    ${isOpen(c) ? `<details class="method"><summary>More actions</summary><div class="stack" style="margin-top:10px">
      <label class="f">Post a public update<input class="input" id="sUpd" maxlength="300"></label><button class="btn sm" id="sUpdSend">Post update</button>
      <label class="f">Move to another department<select class="input" id="sDept">${cfg().departments.map((x) => `<option value="${esc(x.id)}" ${x.id === c.dept ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select></label><button class="btn sm" id="sDeptSend">Move</button>
      <label class="check"><input type="checkbox" id="sComm" ${c.needsCommunity ? "checked" : ""}>Ask nearby citizens to verify independently</label>
    </div></details>` : ""}</div>`;
}
function bindStaff(c) {
  const go = (status, entry, mut) => patchComplaint(c._id, (x) => { x.status = status; mut && mut(x); }, { type: status, ...entry });
  $$("[data-s]").forEach((b) => b.onclick = () => busy(b, () => go(b.dataset.s, { note: b.dataset.s === "review" ? "Verified as a valid complaint" : "Team is on site" })));
  const sel = $("#sTeam"); if (sel) sel.onchange = () => $("#sTeamOther").classList.toggle("hidden", sel.value !== "__other");
  const as = $("#sAssign"); if (as) as.onclick = () => busy(as, async () => {
    const team = sel.value === "__other" ? $("#sTeamOther").value.trim() : sel.value; if (!team) { toast("Choose or name a team."); return; }
    await go("assigned", { team, note: $("#sNote").value.trim() || null }, (x) => { x.team = team; });
  });
  const ro = $("#sRejectOpen"); if (ro) ro.onclick = () => $("#sRejectForm").classList.remove("hidden");
  const rj = $("#sReject"); if (rj) rj.onclick = () => busy(rj, async () => { const r = $("#sRejReason").value.trim(); if (r.length < 5) { toast("Give the citizen a reason."); return; } await go("rejected", { note: r }, (x) => { x.closedAt = now(); }); });
  const rs = $("#sResolve"); if (rs) rs.onclick = () => busy(rs, async () => {
    const note = $("#sResNote").value.trim(); const files = [...$("#sResFiles").files].slice(0, 4);
    if (note.length < 8) { toast("Describe what was done."); return; } if (!files.length) { toast("Add at least one after-repair photo."); return; }
    const media = []; for (const f of files) media.push(await storeMedia(f));
    await go("awaiting", { note }, (x) => { x.resolutions = [...(x.resolutions || []), { at: now(), by: S.uid, note, media, outcome: "pending" }]; x.verifyDeadline = now() + (cfg().verifyDays || 7) * DAY; });
    toast("Sent to the reporter for verification.");
  }, "Uploading…");
  const lp = $("#sLapse"); if (lp) lp.onclick = () => busy(lp, () => go("lapsed", { note: "Administrator closed after the verification deadline passed without a citizen response. Not counted as citizen-confirmed." }, (x) => { x.closedAt = now(); const r = x.resolutions[x.resolutions.length - 1]; if (r) r.outcome = "no_response"; }));
  const ds = $("#sDispSend"); if (ds) ds.onclick = () => busy(ds, async () => { const v = $("#sDisp").value.trim(); if (!v) return; await patchComplaint(c._id, () => {}, { type: "dispute_reply", note: v }); });
  const us = $("#sUpdSend"); if (us) us.onclick = () => busy(us, async () => { const v = $("#sUpd").value.trim(); if (!v) return; await patchComplaint(c._id, () => {}, { type: "note", note: v }); });
  const dp = $("#sDeptSend"); if (dp) dp.onclick = () => busy(dp, async () => { const v = $("#sDept").value; if (v === c.dept) return; await patchComplaint(c._id, (x) => { x.dept = v; x.team = null; if (x.status === "assigned" || x.status === "progress") x.status = "review"; }, { type: "dept", note: `Moved from ${deptOf(c.dept).name} to ${deptOf(v).name}` }); });
  const cm = $("#sComm"); if (cm) cm.onchange = () => patchComplaint(c._id, (x) => { x.needsCommunity = cm.checked; }, null).catch((e) => toast(dbErr(e)));
}

/* ----- community verification ----- */
function communityPanel(c, mine) {
  const vs = c.community || []; const exists = vs.filter((v) => v.verdict === "exists").length, fixed = vs.filter((v) => v.verdict === "fixed").length, notFixed = vs.filter((v) => v.verdict === "not_fixed").length;
  const disagree = (fixed && notFixed) || (fixed && (c.resolutions || []).some((r) => r.outcome === "disputed")) || (notFixed && c.status === "confirmed");
  const showForm = S.uid && !mine && (c.needsCommunity || c.status === "awaiting" || isOpen(c));
  if (!vs.length && !showForm) return "";
  return `<div class="card stack"><div class="row between"><h3>Community verification</h3>${c.needsCommunity ? '<span class="pill plain t-blue">Requested</span>' : ""}</div>
    <p class="small muted">Independent checks by other residents. ${c.needsCommunity ? `High-priority issues ask for at least ${cfg().communityMin} independent confirmations.` : ""}</p>
    <div class="row small"><span class="pill plain t-grey num">${exists} saw the problem</span><span class="pill plain t-green num">${fixed} say fixed</span><span class="pill plain t-red num">${notFixed} say not fixed</span></div>
    ${disagree ? '<div class="banner warn small">Verifications disagree. An administrator should review the evidence.</div>' : ""}
    ${vs.filter((v) => v.note).slice(-4).map((v) => `<div class="small"><span class="muted">${fmtDate(v.at)} · ${esc({ exists: "Saw the problem", fixed: "Says fixed", not_fixed: "Says not fixed" }[v.verdict])}:</span> ${esc(v.note)}</div>`).join("")}
    ${showForm ? `<div class="stack" id="cvForm"><div class="seg" id="cvV">${(c.status === "awaiting" || (c.resolutions || []).length ? [["fixed", "Repair looks done"], ["not_fixed", "Not fixed"]] : [["exists", "I can see this problem"], ["not_found", "Couldn't find it"]]).map(([k, l]) => `<button type="button" data-v="${k}">${l}</button>`).join("")}</div>
      <input class="input" id="cvNote" maxlength="300" placeholder="Optional note"><label class="f small">Photo (optional)<input type="file" id="cvFile" accept="image/*" class="input"></label><button class="btn sm" id="cvSend">Add my verification</button></div>` : ""}
  </div>`;
}
function bindCommunity(c) {
  let v = null; $$("#cvV button").forEach((b) => b.onclick = () => { v = b.dataset.v; $$("#cvV button").forEach((x) => x.classList.toggle("on", x === b)); });
  const s = $("#cvSend"); if (!s) return;
  s.onclick = () => busy(s, async () => {
    if (!guardWrite()) return; if (!v) { toast("Choose what you saw."); return; }
    const key = await myKey(c._id, "v:"); const f = $("#cvFile").files[0]; const media = f ? [await storeMedia(f)] : [];
    await patchComplaint(c._id, (x) => { x.community = [...(x.community || []).filter((y) => y.key !== key), { key, verdict: v, note: $("#cvNote").value.trim().slice(0, 300), media, at: now() }]; }, { type: "community", note: { exists: "A resident confirmed the problem exists", not_found: "A resident could not find the problem", fixed: "A resident says the repair looks done", not_fixed: "A resident says it is not fixed" }[v] });
    toast("Thanks for verifying.");
  });
}

const CHARTS = [];
function monthlyChart(canvas, list) {
  if (!canvas || typeof Chart === "undefined") return;
  const labels = [], rec = [], conf = []; const d = new Date(); d.setDate(1);
  for (let i = 5; i >= 0; i--) { const m = new Date(d.getFullYear(), d.getMonth() - i, 1), n = new Date(d.getFullYear(), d.getMonth() - i + 1, 1);
    labels.push(m.toLocaleString("en-IN", { month: "short" })); rec.push(list.filter((c) => c.createdAt >= m && c.createdAt < n).length); conf.push(list.filter((c) => c.status === "confirmed" && c.closedAt >= m && c.closedAt < n).length); }
  barChart(canvas, labels, [{ label: "Received", data: rec, color: cssVar("--map-line") }, { label: "Citizen-confirmed", data: conf, color: cssVar("--primary") }]);
}
function barChart(canvas, labels, sets, opts = {}) {
  const ink = cssVar("--muted"), grid = cssVar("--line");
  const ch = new Chart(canvas, { type: "bar", data: { labels, datasets: sets.map((s) => ({ label: s.label, data: s.data, backgroundColor: s.color, borderRadius: 4, maxBarThickness: 26 })) },
    options: { indexAxis: opts.horizontal ? "y" : "x", responsive: true, maintainAspectRatio: false, animation: { duration: 300 }, plugins: { legend: { labels: { color: ink, boxWidth: 10, font: { size: 12 } } } },
      scales: { x: { ticks: { color: ink }, grid: { color: opts.horizontal ? grid : "transparent" } }, y: { beginAtZero: true, ticks: { color: ink, precision: 0 }, grid: { color: opts.horizontal ? "transparent" : grid } } } } });
  CHARTS.push(ch);
}

      <table class="tbl"><thead><tr><th>Factor</th><th>Max</th><th>Rule</th></tr></thead><tbody>${HEALTH_METHOD.map(([a, b, c]) => `<tr><td>${a}</td><td class="num">−${b}</td><td>${c}</td></tr>`).join("")}</tbody></table>
      <p><strong>Few reports do not mean a healthy area.</strong> Where a neighbourhood has under a third of the city's median report count, CivicPulse marks it "Not enough reports" instead of giving a score, and lists it under Unheard neighbourhoods.</p></div></details>
      <div class="grid g3">${hs.map((h) => `<div class="card tight stack"><div class="row between"><strong>${esc(L2({ en: h.l.name, kn: h.l.kn }))}</strong>${h.lowData ? '<span class="pill plain t-amber">Not enough reports</span>' : `<span class="score" style="color:${tone(h.score)}">${h.score}</span>`}</div>

  },
  predict() {
    const pr = predictions();
    return `<div class="stack-lg"><div class="banner info small">${icon("info")}<div>These are <strong>predictions</strong>, not reported incidents. They estimate where a problem is likely to recur from the history of reports, the season (Bengaluru's monsoon months) and any active rain warning entered by an administrator.</div></div>
      <div class="card stack">${pr.length ? `<div class="scroll-x"><table class="tbl"><thead><tr><th>Neighbourhood</th><th>Likely problem</th><th>Estimated likelihood</th><th>Why</th></tr></thead><tbody>${pr.map((p) => `<tr><td><strong>${esc(locName(p.locality))}</strong></td><td>${esc(p.label)} <span class="pill plain t-blue">Prediction</span></td><td style="min-width:140px"><div class="row" style="gap:8px"><div class="bar-h" style="flex:1"><span style="width:${Math.round(p.p * 100)}%;background:var(--blue)"></span></div><span class="num small">${Math.round(p.p * 100)}%</span></div></td><td class="small muted">${esc(p.why)}</td></tr>`).join("")}</tbody></table></div>` : empty("Not enough history yet. Predictions need at least two past reports of the same kind in a neighbourhood.")}</div>

  },
  repeat() {

      ${reps.length ? reps.map((r) => `<div class="card flat tight stack"><div class="row between"><strong>${esc(L2(catOf(r.cat)))} · ${esc(locName(r.locality))}</strong><span class="pill t-red">${r.kind === "returned" ? `Returned after ${r.days} days` : `Repair rejected ${r.reopen}×`}</span></div>
        <div class="small">Original: <a href="#complaint-${esc(r.base._id)}">${esc(cid(r.base))}</a> ${sampleTag(r.base)}${r.later.length ? ` · came back as ${r.later.map((l) => `<a href="#complaint-${esc(l._id)}">${esc(cid(l))}</a>`).join(", ")}` : ""}</div></div>`).join("") : empty("No repeat locations detected.")}</div>`;

      <form class="card stack" id="svForm"><h3>Neighbourhood survey</h3><p class="small muted">Takes a minute. Answers are stored without your name. Kannada or English is fine.</p>

        <label class="f">Biggest problem you see<textarea class="input" id="svNote" maxlength="800"></textarea></label>

        <button class="btn primary" style="align-self:flex-start">Submit survey</button></form></div>`;
  },
  perf() {

      ${st.map(({ d, s }) => `<tr><td>${esc(d.name)}</td><td class="num">${s.total}</td><td class="num">${s.open}</td><td class="num" style="${s.overdue ? "color:var(--red);font-weight:600" : ""}">${s.overdue}</td><td class="num">${s.confirmed}</td><td class="num">${s.reopened}</td><td class="num">${s.firstTimeRate != null ? Math.round(s.firstTimeRate * 100) + "%" : "—"}</td><td class="num">${s.avgDays != null ? s.avgDays.toFixed(1) : "—"}</td></tr>`).join("")}</tbody></table></div>

      <div class="legend">${Object.entries(ACCESS_KINDS).map(([k, [l, c]]) => `<span><i style="background:${c}"></i>${l}</span>`).join("")}<span><i style="background:transparent;border:2px dashed var(--muted)"></i>Unverified</span></div>
      <div id="axRoute"></div></div>`;
  },
  after() {
    const map = makeMap($("#axMap"), { onClick: axClick }); if (!map) return; const layer = L.layerGroup().addTo(map);
    function draw() {
      layer.clearLayers();
      for (const p of S.access) {
        const v = axVerified(p); const [lab, col] = ACCESS_KINDS[p.kind] || ["Point", "#666"];
        const mk = L.circleMarker([p.lat, p.lng], { radius: 8, color: v ? cssVar("--card") : col, weight: 2, dashArray: v ? null : "3 3", fillColor: col, fillOpacity: v ? 0.95 : 0.35 });
        mk.bindPopup(`<strong>${esc(lab)}</strong> ${sampleTag(p)}<br>${esc(p.note || "")}<br><span class="muted">${(p.confirms || []).length} confirm · ${(p.disputes || []).length} dispute · ${v ? "verified" : "not yet verified"}</span>${p.kind === "obstacle" && p.cleared ? "<br>Reported cleared" : ""}<br>
          ${S.uid ? `<button class="btn sm" data-axc="${esc(p._id)}">Confirm</button> <button class="btn sm ghost" data-axd="${esc(p._id)}">It's not there</button>` : ""}`);
        mk.on("popupopen", (e) => { const el = e.popup.getElement(); el.querySelector("[data-axc]")?.addEventListener("click", () => axVote(p, "confirms")); el.querySelector("[data-axd]")?.addEventListener("click", () => axVote(p, "disputes")); });
        layer.addLayer(mk);
      }
      if (AX.a) layer.addLayer(L.circleMarker(AX.a, { radius: 7, color: cssVar("--ink"), fillColor: cssVar("--ink"), fillOpacity: 1 }));
      if (AX.a && AX.b) { layer.addLayer(L.polyline([AX.a, AX.b], { color: cssVar("--primary"), weight: 4, dashArray: "8 6" })); layer.addLayer(L.circleMarker(AX.b, { radius: 7, color: cssVar("--primary"), fillColor: cssVar("--primary"), fillOpacity: 1 })); }
    }
    VIEWS.access._draw = draw; draw(); axRouteReport();
    $$("#axMode button").forEach((b) => b.onclick = () => { AX.mode = b.dataset.v; if (AX.mode === "route") { AX.a = AX.b = null; } render(true); });
    const k = $("#axKind"); if (k) k.onchange = () => (AX.kind = k.value);
  },
  refresh() { VIEWS.access._draw && VIEWS.access._draw(); axRouteReport(); },
};
const axVerified = (p) => (p.confirms || []).length >= 2 && (p.confirms || []).length > (p.disputes || []).length;
async function axVote(p, field) {
  if (!guardWrite()) return; const k = await myKey(p._id, "ax:"); if (p.byKey === k) { toast("You added this point; others need to confirm it."); return; }
  const other = field === "confirms" ? "disputes" : "confirms";
  try { await write(() => S.db.collection("access").doc(p._id).update({ [field]: [...new Set([...(p[field] || []), k])], [other]: (p[other] || []).filter((x) => x !== k) })); toast("Thanks."); } catch (e) { toast(dbErr(e)); }
}
function axClick(ll) {
  if (AX.mode === "add") {
    if (!guardWrite()) return;
    modal(`<h3>Add ${esc(ACCESS_KINDS[AX.kind][0].toLowerCase())}</h3><label class="f">Describe it<input class="input" id="axNote" maxlength="200" placeholder="e.g. Ramp at the metro exit, gentle slope"></label><div class="row" style="justify-content:flex-end"><button class="btn" data-close>Cancel</button><button class="btn primary" id="axSave">Add point</button></div>`,
      (m, close) => { $("#axSave", m).onclick = (e) => busy(e.currentTarget, async () => { const id = "AX-" + uidGen(6); const byKey = await myKey(id, "ax:");
        await write(() => S.db.collection("access").doc(id).set({ kind: AX.kind, lat: +ll.lat.toFixed(6), lng: +ll.lng.toFixed(6), locality: nearestLocality(ll.lat, ll.lng).id, note: $("#axNote", m).value.trim(), confirms: [], disputes: [], byKey, at: now() })); close(); toast("Point added. It shows as verified after two confirmations."); }); });
  } else if (AX.mode === "route") {
    if (!AX.a || AX.b) { AX.a = [ll.lat, ll.lng]; AX.b = null; } else AX.b = [ll.lat, ll.lng];
    $("#axHint").textContent = AX.b ? "Route checked. Tap to start again." : "Now tap your destination.";
    VIEWS.access._draw(); axRouteReport();
  }
}
function segDist(p, a, b) {
  const kx = 111320 * Math.cos((a[0] * Math.PI) / 180), ky = 110540;
  const ax = 0, ay = 0, bx = (b[1] - a[1]) * kx, by = (b[0] - a[0]) * ky, px = (p[1] - a[1]) * kx, py = (p[0] - a[0]) * ky;
  const l2 = bx * bx + by * by; const tt = l2 ? clamp((px * bx + py * by) / l2, 0, 1) : 0; return Math.hypot(px - tt * bx, py - tt * by);
}
function axRouteReport() {
  const box = $("#axRoute"); if (!box) return; if (!AX.a || !AX.b) { box.innerHTML = ""; return; }
  const len = E.distance(AX.a[0], AX.a[1], AX.b[0], AX.b[1]);
  const near = S.access.map((p) => ({ p, d: segDist([p.lat, p.lng], AX.a, AX.b) })).filter((x) => x.d < 80);
  const obs = near.filter((x) => x.p.kind === "obstacle" && !x.p.cleared), good = near.filter((x) => x.p.kind !== "obstacle" && axVerified(x.p));
  const issues = allC().filter((c) => isOpen(c) && ["accessibility", "pedestrian", "open_manhole", "pothole", "fallen_tree", "flooding"].includes(c.cat) && segDist([c.lat, c.lng], AX.a, AX.b) < 60);
  box.innerHTML = `<div class="card stack"><div class="row between"><h3>Route check · ${(len / 1000).toFixed(2)} km straight line</h3><span class="pill ${obs.length || issues.length ? "t-red" : "t-green"}">${obs.length || issues.length ? `${obs.length + issues.length} barrier${obs.length + issues.length > 1 ? "s" : ""} on the way` : "No known barriers"}</span></div>
    <p class="small muted">Checks reported obstacles and open complaints within 60–80 m of the straight line. Without street data this can't plan turn-by-turn routes; use it to spot known barriers.</p>
    ${obs.map((x) => `<div class="small">• Obstacle: ${esc(x.p.note || "footpath obstacle")} (${axVerified(x.p) ? "verified" : "unverified"})</div>`).join("")}
    ${issues.map((c) => `<div class="small">• Open complaint: <a href="#complaint-${esc(c._id)}">${esc(c.title)}</a></div>`).join("")}
    ${good.length ? `<div class="small muted">Verified accessible features nearby: ${good.map((x) => esc(ACCESS_KINDS[x.p.kind][0])).join(", ")}</div>` : ""}</div>`;
}

        <button class="btn" id="sosGps">${icon("pin", 16)}Use my location</button></div>

        <div class="map short" id="sosMap"></div>
        <input class="input" id="sosNote" maxlength="200" placeholder="Optional: landmark or detail">

      <div class="card stack"><h3>Active hazards</h3>${active.length ? `<div class="clist">${active.map((c) => citem(c)).join("")}</div>` : '<p class="small muted">No active hazards reported.</p>'}</div></div>`;
  },

      if (map) { pin ? pin.setLatLng([lat, lng]) : (pin = L.circleMarker([lat, lng], { radius: 9, color: cssVar("--card"), weight: 2, fillColor: cssVar("--red"), fillOpacity: 1 }).addTo(map)); if (pan) map.setView([lat, lng], 16); } }
    if (SOSD.lat) setP(SOSD.lat, SOSD.lng);
    $$("[data-sos]").forEach((b) => b.onclick = () => { SOSD.cat = b.dataset.sos; $$("[data-sos]").forEach((x) => x.classList.toggle("on", x === b)); $("#sosSend").disabled = false; });
    $("#sosLoc").onchange = (e) => { const l = locOf(e.target.value); if (l) { SOSD.locality = l.id; if (!SOSD.lat || nearestLocality(SOSD.lat, SOSD.lng).id !== l.id) setP(l.lat, l.lng, true); } };
    $("#sosGps").onclick = () => navigator.geolocation ? navigator.geolocation.getCurrentPosition((p) => setP(p.coords.latitude, p.coords.longitude, true), () => ($("#sosHint").textContent = "This page can't read your device location. Pick the neighbourhood or tap the map."), { timeout: 8000 }) : null;
    $("#sosSend").onclick = (e) => busy(e.currentTarget, async () => {
      if (!guardWrite()) return; if (!SOSD.cat) return toast("Choose the hazard type.");
      if (!SOSD.lat) { toast("Pick a neighbourhood or tap the map."); return; }
      const s = SOS_TYPES.find((x) => x.cat === SOSD.cat); const note = $("#sosNote").value.trim();

      await submitReportDirect(); Object.assign(SOSD, { cat: null, lat: null, lng: null });

async function submitReportDirect() { await submitReport(); }

/* ---------- public money transparency ---------- */

/* ---------- about / methodology ---------- */
VIEWS.about = {
  html() {
    return `<div class="wrap section stack-lg" style="max-width:880px">
      <div><div class="eyebrow">Methodology</div><h2 style="margin-top:6px">How CivicPulse works</h2></div>
      <div class="card stack"><h3>Citizen-verified resolution</h3><p class="small">A department can never close a complaint by marking it resolved. After uploading after-repair photos and a description, the status becomes <em>Awaiting citizen verification</em> and the original reporter is notified. Only the reporter can choose <strong>Yes, fixed</strong> (closes it, with the date recorded) or <strong>No, not fixed</strong> (reopens it with their reason and photos; earlier repair records are kept). If the reporter doesn't respond by the administrator's deadline, the complaint is either kept waiting or closed as "not verified by citizen", depending on the setting. It is never counted as citizen-confirmed.</p>
        <p class="small">Anonymous reporters keep this power: the complaint stores only a one-way key derived from the reporter's account and the complaint ID, so the reporter's device can prove ownership without the name being stored.</p></div>
      <div class="card stack"><h3>Priority and severity (C engine)</h3><p class="small">Severity (1–5) = category base risk, plus hazards (exposed electricity +1.5, open pit +1, flooding +0.8, traffic or health +0.3 each), plus support (3+ people +0.5, 10+ +1), blended 70/30 with the reporter's own estimate.</p>
        <p class="small">Priority (0–100) = severity × 9, + 4 per vulnerable group affected (+3 more if emergency access is blocked), + 3 × population band, + 3 × location sensitivity, + 0.2 per day waiting (max 30 days), + 0.25 per supporter (max 20), + 2 per failed repair (max 3).</p>
        <p class="small">These run in C compiled to WebAssembly in your browser. Engine in use right now: <strong>${esc(E.kind)}</strong>.</p>
        <details class="method"><summary>View the C source</summary><pre class="code">${esc(C_SOURCE)}</pre></details></div>
      <div class="card stack"><h3>Duplicate detection</h3><p class="small">When you pin a location, the C engine finds reports within ${cfg().dupRadius || 75}–${Math.round((cfg().dupRadius || 75) * 1.4)} m. Each is scored on distance (45%), wording overlap (25%), same category (20%) and photo similarity from a 64-bit perceptual hash (10%). You choose whether to link; every individual report is kept and counts as support.</p></div>
      <div class="card stack"><h3>AI features</h3><p class="small">Photo classification, text classification and before/after repair comparison use Claude through this page, on the viewer's own Claude account, and ask for permission the first time. They only suggest; a person always makes the decision. If AI isn't available, keyword matching suggests a category instead. Civic Health Scores, predictions and repeat-location detection are transparent statistical rules, shown in full on the Insights page.</p></div>
      <div class="card stack"><h3>Roles</h3><p class="small"><strong>Citizens</strong> report, support, verify and volunteer. <strong>Officials</strong> see their department's queue and move complaints through review, assignment, work and repair evidence. <strong>Administrators</strong> manage people, departments, categories, settings, published projects, rain alerts and NGO verification. Sign-in uses your claude.ai account. Configuration, roles and published projects can only be changed by the owner and Editors; this is enforced by the data store.</p></div>
      <div class="card stack"><h3>What isn't connected</h3><ul class="small" style="margin:0;padding-left:18px">
        <li>No official government system is connected. Departments are working names; complaints are not forwarded to BBMP, BWSSB or BESCOM.</li>
        <li>Street map tiles can't load in this host, so the map shows a schematic of neighbourhood boundaries (approximate).</li>
        <li>Device GPS is usually blocked inside this page; pin locations on the map.</li>
        <li>Weather data isn't fetched automatically. Administrators enter official rain warnings.</li>
        <li>Notifications are in-app only. Email, SMS and push need a messaging service.</li>
        <li>Voice input and read-aloud depend on your browser and app; on phones they may be unavailable.</li>
        <li>Department-level permissions (an official acting only on their own department) are enforced by the app, not by the data store.</li></ul></div>
      ${footer()}</div>`;
  },
};

/* ---------- boot ---------- */
async function boot() {
  document.documentElement.lang = S.lang;
  render(true);
  await initEngine();
  if (!window.claude || !claude.use) {
    S.standalone = true; S.db = makeLocalBackend(); S.user = LOCAL_USER; S.isOwner = true; S.uid = "demo-user"; S.started = true;
    startData(); return;
  }
  const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
  S.db = db; S.user = user; S.started = true;
  if (user) { try { S.isOwner = !!(await user.isOwner()); } catch {} try { S.uid = await user.id(); } catch {} try { const cw = await user.can("data.write"); S.canWrite = cw; if (cw === false) S.readOnly = true; } catch {} }
  if (!S.isOwner) { S.preview = null; }
  if (S.db) startData(); else render(true);
  claude.use("assets").then((a) => (S.assets = a)).catch(() => {});
  claude.use("sample").then(async (s) => { S.sample = s; if (s) { try { const l = await s.limits(); S.sampleImages = !!l.images; } catch {} } render(); }).catch(() => {});
  claude.use("dictation").then((d) => { S.dictation = d; if (route().name === "report") render(true); }).catch(() => {});
  claude.use("tts").then((x) => (S.tts = x)).catch(() => {});
}
boot();
